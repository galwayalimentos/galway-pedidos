<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galway Alimentos · Pedidos mayoristas</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Galway">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f6;--sf:#fff;--ink:#0d1414;--mute:#566565;--line:#d6e0e0;--hd:#0a0a0a;--tq:#19c9bc;--tqi:#04201d;--tqs:#dff7f4;--warn:#9a5a00;--warns:#fff1d9;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0c1111;--sf:#151d1d;--ink:#e9f2f1;--mute:#93a8a6;--line:#263332;--tqs:#10332f;--warn:#f0b35a;--warns:#33280f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:#fff;padding:12px 16px 0}
.hd{max-width:820px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff}
.brand .t{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700}
.brand p{margin:0;font-size:13px;color:#9fb5b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;background:transparent;border:1px solid #3a4a49;color:#fff;border-radius:10px;font:inherit;font-size:14px;padding:8px 12px;cursor:pointer}
.ib .dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--tq);color:var(--tqi);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
nav{display:flex}
nav button{flex:1;background:transparent;border:0;color:#fff;font:inherit;font-size:14px;padding:10px 4px;opacity:.7;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-current="true"]{opacity:1;font-weight:700;border-color:var(--tq)}
.bdg{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--tq);color:var(--tqi);font-size:12px;font-weight:700}
main{max-width:820px;margin:0 auto;padding:14px 16px}
.note{font-size:13px;color:var(--mute);background:var(--sf);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px}
.chips button{flex:none;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--hd);color:#fff;border-color:var(--hd)}
.prod{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ph{flex:none;width:52px;height:52px;border-radius:8px;background:var(--tqs);display:grid;place-items:center;font-weight:700;font-size:20px}
.pi{flex:1;min-width:0}
.pi b{display:block;text-transform:capitalize}
.pi small{display:block;color:var(--mute);font-size:13px}
.step{display:flex;align-items:center;gap:3px}
.step button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.step button.pl{background:var(--tq);color:var(--tqi);border-color:var(--tq)}
.step button:disabled{opacity:.35;cursor:default}
.step input{width:56px;text-align:center;font-weight:700;padding:8px 2px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--hd);color:#fff}
.bar div{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{background:var(--tq);color:var(--tqi);border:0;border-radius:10px;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:820px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 8px;font-size:20px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.ln span:last-child{white-space:nowrap;text-align:right}
.ln.rm{color:var(--mute);text-decoration:line-through}
.ln s{color:var(--mute)}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.t{font-size:20px;font-weight:700;padding-top:10px}
.warn{color:var(--warn);font-size:14px;margin:6px 0}
.err{color:var(--bad);font-size:14px;margin:6px 0}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card.act{border-color:var(--tq);box-shadow:0 0 0 2px var(--tqs)}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta h3{margin:0;font-size:17px}
.st{font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.st.pending_review,.st.awaiting_client{background:var(--warns);color:var(--warn);border-color:transparent}
.st.confirmed,.st.preparing,.st.shipped,.st.delivered{background:var(--tqs)}
.st.rejected,.st.expired{color:var(--bad)}
.tag{font-size:13px;color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert{background:var(--warns);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.center{text-align:center;padding:30px 10px}
.center h2{font-size:24px;margin:0 0 6px}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.login{max-width:380px;margin:30px auto;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:22px}
.login img{display:block;width:96px;height:96px;border-radius:50%;margin:0 auto 10px}
.login h2{text-align:center;margin:0 0 4px}
.login .btn{width:100%;margin-top:16px}
.lnk{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;margin-top:10px;width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--mute);font-size:13px}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--hd);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;max-width:90%;display:none}
.nt{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nt.un b::before{content:"● ";color:var(--tq)}
#printarea{display:none}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block;color:#000;background:#fff;font:14px Arial,sans-serif}#printarea table{font-size:15px}#printarea th,#printarea td{border-bottom:1px solid #999;padding:6px 4px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div><div id="toast" role="status"></div><div id="printarea"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s);
const fmt=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round(x*100)/100;
const kg=n=>Number(n).toLocaleString('es-AR',{maximumFractionDigits:2,useGrouping:false});
const pn=s=>parseFloat(String(s).replace(',','.'))||0;
const dt=s=>new Date(s).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});
const ST={pending_review:'Pendiente de revisión',awaiting_client:'Esperando confirmación',confirmed:'Confirmado',preparing:'En armado',shipped:'Enviado',delivered:'Entregado',rejected:'Rechazado',expired:'Vencido'};
const NEXT={confirmed:'preparing',preparing:'shipped',shipped:'delivered'};
const S={view:'boot',user:null,profile:null,client:null,products:[],settings:{min_order:150000,response_hours:48,whatsapp:'5491131766172',iva_rate:0.21},orders:[],notifs:[],cart:{},cat:'Todos',q:'',inv:'none',note:'',sheet:null,edits:{},tab:'pending_review',prev:null,clients:[],links:{},lastId:null,err:'',hash0:location.hash};
const staff=()=>S.profile&&(S.profile.role==='admin'||S.profile.role==='operator');
const admin=()=>S.profile&&S.profile.role==='admin';
const ok=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)};
const run=async fn=>{try{await fn()}catch(e){console.error(e);toast(e.message||'Ocurrió un error. Probá de nuevo.')}};
const IVA=()=>Number(S.settings.iva_rate)||0.21;
const calc=(ls,inv)=>{const sub=ls.reduce((a,l)=>a+l.p*l.q,0);const iva=inv==='none'?0:sub*IVA();return{sub,iva,tot:sub+iva}};
const totals=(ls,inv)=>{const c=calc(ls,inv);return `<div class="sum"><span>Subtotal sin IVA</span><span>${fmt(c.sub)}</span></div>`+(inv==='none'?'':`<div class="sum"><span>IVA ${Math.round(IVA()*100)}%</span><span>${fmt(c.iva)}</span></div>`)+`<div class="sum t"><span>Total${inv==='none'?'':' con IVA'}</span><span>${fmt(c.tot)}</span></div>`};
const invTxt=f=>f==='none'?'Remito (sin IVA)':'Factura '+f+' (+IVA)';
const unread=()=>S.notifs.filter(n=>!n.read).length;

/* ---------- Arranque y sesión ---------- */
async function boot(){
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.view='setpw';render()}});
  const{data:{session}}=await sb.auth.getSession();
  S.user=session?session.user:null;
  if(/type=(invite|recovery)/.test(S.hash0)&&S.user){S.view='setpw';return render()}
  if(S.user)await enter();else{S.view='login';render()}
}
async function enter(){
  const p=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=p.data;
  if(!S.profile){S.view='noaccess';return render()}
  await loadAll();
  if(staff()){await sb.rpc('expire_overdue_orders');await loadOrders()}
  S.view=staff()?'orders':'cat';
  subscribe();render();
}
async function loadAll(){
  const[st,pr,nt]=await Promise.all([sb.from('settings').select('*'),sb.from('products').select('*').order('category').order('name'),sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(40)]);
  (st.data||[]).forEach(r=>S.settings[r.key]=r.value);
  S.products=pr.data||[];S.notifs=nt.data||[];
  if(S.profile.client_id){const c=await sb.from('clients').select('*').eq('id',S.profile.client_id).maybeSingle();S.client=c.data}
  await loadOrders();
}
async function loadOrders(){
  const r=await sb.from('orders').select('*, clients(name), order_items(*)').order('created_at',{ascending:false}).limit(300);
  S.orders=r.data||[];
}
let chan=null;
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('galway').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},p=>{S.notifs.unshift(p.new);toast(p.new.title+(p.new.body?': '+p.new.body:''));run(async()=>{await loadOrders();render()})})
   .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>run(async()=>{await loadOrders();if(!S.sheet)render()})).subscribe();
}
const logout=async()=>{if(chan)sb.removeChannel(chan);await sb.auth.signOut();Object.assign(S,{user:null,profile:null,client:null,orders:[],notifs:[],cart:{},view:'login',sheet:null});render()};

/* ---------- Vistas ---------- */
function head(){
  const who=S.client?S.client.name:(S.profile?(S.profile.full_name||'Equipo Galway'):'Pedidos mayoristas');
  const tabs=staff()?[['orders','Pedidos',S.orders.filter(o=>o.status==='pending_review').length]].concat(admin()?[['prices','Precios',0],['clients','Clientes',0],['settings','Ajustes',0]]:[])
    :[['cat','Catálogo',0],['ord','Mis pedidos',S.orders.filter(o=>o.status==='awaiting_client').length]];
  return `<header><div class="hd"><div class="brand"><img src="logo.png" alt="Galway Alimentos"><div class="t"><h1>Galway Alimentos</h1><p>${esc(who)}</p></div>
  <button class="ib" data-a="bell" aria-label="Avisos">Avisos${unread()?`<span class="dot">${unread()}</span>`:''}</button><button class="ib" data-a="out">Salir</button></div>
  <nav>${tabs.map(([v,t,n])=>`<button data-a="v" data-v="${v}" aria-current="${S.view===v||(S.view==='ok'&&v==='ord')}">${t}${n?`<span class="bdg">${n}</span>`:''}</button>`).join('')}</nav></div></header>`}
function installNote(){
  let hide=false;try{hide=localStorage.getItem('gw_inst')==='1'}catch(e){}
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(standalone||hide||staff())return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="note">${ios?'Para recibir avisos en tu iPhone: tocá Compartir y elegí “Agregar a inicio”.':'Podés instalar esta app: abrí el menú del navegador y elegí “Instalar app” o “Agregar a pantalla de inicio”.'} <button class="lnk" style="width:auto;margin:0 0 0 6px" data-a="hideinst">Ocultar</button></div>`}
function catView(){
  const cats=['Todos',...new Set(S.products.filter(p=>p.active).map(p=>p.category))];
  return `${installNote()}<p class="note">Los precios son por kilo y no incluyen IVA.</p><input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" value="${esc(S.q)}"><div class="chips">${cats.map(c=>`<button data-a="c" data-c="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join('')}</div><div id="list"></div>`}
function listHTML(){
  const s=S.q.trim().toLowerCase();
  const r=S.products.filter(p=>p.active&&(S.cat==='Todos'||p.category===S.cat)&&(!s||p.name.toLowerCase().includes(s)));
  return r.length?r.map(p=>{const n=S.cart[p.code]||0;return `<article class="prod"><div class="ph" aria-hidden="true">${esc(p.name[0]||'?').toUpperCase()}</div><div class="pi"><b>${esc(p.name)}</b><span>${fmt(p.price_per_kg)} por kg</span><small>${p.multiple!=1?`Se pide de a ${kg(p.multiple)} kg · ${fmt(p.price_per_kg*p.multiple)} cada ${kg(p.multiple)} kg`:'Se pide por kg'}</small></div><div class="step"><button data-a="m" data-c="${esc(p.code)}" aria-label="Quitar ${kg(p.multiple)} kg de ${esc(p.name)}" ${n?'':'disabled'}>−</button><input data-a="qty" data-c="${esc(p.code)}" inputmode="decimal" value="${kg(n)}" aria-label="Kilos de ${esc(p.name)}"><button class="pl" data-a="p" data-c="${esc(p.code)}" aria-label="Agregar ${kg(p.multiple)} kg de ${esc(p.name)}">+</button></div></article>`}).join(''):'<p class="empty">No hay productos para mostrar.</p>'}
const cartLines=()=>Object.entries(S.cart).map(([code,q])=>{const p=S.products.find(x=>x.code===code);return p?{code,n:p.name,p:Number(p.price_per_kg),q}:null}).filter(Boolean);
function bar(){const ls=cartLines(),n=r2(ls.reduce((a,l)=>a+l.q,0));return(S.view==='cat'&&n)?`<div class="bar"><div><span><b>${kg(n)} kg</b> · ${fmt(calc(ls,'none').sub)} sin IVA</span><button class="btn" data-a="open">Ver pedido</button></div></div>`:''}
function itemsOf(o){return o.order_items.slice().sort((a,b)=>a.id-b.id)}
function qOf(o,i){const e=S.edits[o.id];return e&&e[i.id]!==undefined?e[i.id]:i.qty}
function orderCard(o,isStaff){
  const its=itemsOf(o),edit=isStaff&&o.status==='pending_review';
  const ls=its.map(i=>({p:Number(i.unit_price),q:qOf(o,i)}));
  const changed=its.some(i=>qOf(o,i)!==i.original_qty);
  const lines=its.map(i=>{const q=qOf(o,i),rm=q===0;
    const ctl=edit?`<div style="padding:4px 0" class="acts"><button class="btn alt sm" data-a="eq" data-o="${o.id}" data-i="${i.id}" data-d="-1" aria-label="Menos ${esc(i.product_name)}" ${q?'':'disabled'}>−</button><button class="btn alt sm" data-a="eq" data-o="${o.id}" data-i="${i.id}" data-d="1" aria-label="Más ${esc(i.product_name)}" ${q<i.original_qty?'':'disabled'}>+</button><button class="btn alt sm" data-a="ex" data-o="${o.id}" data-i="${i.id}" ${rm?'disabled':''}>Quitar</button></div>`:'';
    return `<div class="ln ${rm?'rm':''}"><span>${esc(i.product_name)}${q!==i.original_qty&&!rm?' <small class="tag">(cambió)</small>':''}${rm?' <small class="tag">(sin stock)</small>':''}</span><span>${q!==i.original_qty?`<s>${kg(i.original_qty)}</s> `:''}${kg(q)} kg · ${fmt(i.unit_price*q)}</span></div>${ctl}`}).join('');
  let a='';const wait=!isStaff&&o.status==='awaiting_client';
  const exp=o.expires_at&&new Date(o.expires_at)<new Date();
  if(isStaff){
    if(o.status==='pending_review')a=`${changed?`<input id="mv-${o.id}" placeholder="Motivo del cambio (ej.: faltante de stock)" aria-label="Motivo del cambio" style="margin-top:8px">`:''}<div class="acts"><button class="btn" data-a="apr" data-id="${o.id}">${changed?'Enviar cambios al cliente':'Aprobar tal cual'}</button></div><p class="tag">Podés ajustar o quitar productos antes de aprobar.</p>`;
    else if(o.status==='awaiting_client')a=`<p class="tag">Esperando respuesta del cliente${o.expires_at?' hasta '+dt(o.expires_at):''}.</p>`;
    else if(NEXT[o.status])a=`<div class="acts"><button class="btn" data-a="adv" data-id="${o.id}">Pasar a “${ST[NEXT[o.status]]}”</button><button class="btn alt" data-a="pdf" data-id="${o.id}">PDF para Alegra</button><button class="btn alt" data-a="sheetp" data-id="${o.id}">Hoja de armado</button></div>`;
    else if(o.status==='delivered')a=`<div class="acts"><button class="btn alt" data-a="pdf" data-id="${o.id}">PDF para Alegra</button></div>`;
    if(admin())a+=`<div class="acts"><button class="btn alt sm" data-a="del" data-id="${o.id}">Borrar pedido</button></div>`;
  }else{
    if(wait)a=exp?`<p class="err">El plazo para responder venció. Hablá con tu vendedor para retomar el pedido.</p>`:`<div class="alert">Modificamos tu pedido${o.change_reason?': '+esc(o.change_reason):''}. Revisá los cambios y confirmá antes del ${dt(o.expires_at)}.</div><div class="acts"><button class="btn" data-a="acc" data-id="${o.id}">Aceptar cambios</button><button class="btn alt" data-a="rej" data-id="${o.id}">Rechazar</button></div>`;
    else if(o.status==='pending_review')a='<p class="tag">Estamos revisando tu pedido. Te avisamos apenas esté listo.</p>';
    else if(['confirmed','preparing','shipped'].includes(o.status))a=`<p class="tag">Pedido confirmado. Coordiná el pago y la entrega con tu vendedor.</p><div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(S.settings.whatsapp)}?text=${encodeURIComponent('Hola, mi pedido #'+o.id+' está confirmado. Quiero coordinar pago y entrega.')}">Hablar por WhatsApp</a></div>`;
    if(['delivered','confirmed','preparing','shipped','rejected','expired'].includes(o.status))a+=`<div class="acts"><button class="btn alt" data-a="rep" data-id="${o.id}">Repetir pedido</button></div>`;
  }
  const st=wait&&exp?'expired':o.status;

/* ---------- Excel ---------- */
const yes=v=>{const s=String(v??'').trim().toLowerCase();return s===''||['sí','si','s','1','true','x'].includes(s)}
const num=v=>{if(typeof v==='number')return v;let s=String(v??'').replace(/[$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)}
async function readSheet(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true}).slice(1).filter(r=>r.some(c=>String(c).trim()!==''))}
async function previewPrices(file){
  const rows=await readSheet(file),errors=[],warns=[],out=[],seenC=new Set(),seenN=new Set();
  const cur=Object.fromEntries(S.products.map(p=>[p.code,p]));
  rows.forEach((r,i)=>{const n=i+2,code=String(r[0]).trim(),name=String(r[1]).trim(),price=num(r[3]),mult=r2(num(r[4]));
    if(!code||!name){errors.push(`Fila ${n}: falta el código o el nombre.`);return}
    if(!(price>0)){errors.push(`Fila ${n} (${name}): el precio no es válido.`);return}
    if(!(mult>0)){errors.push(`Fila ${n} (${name}): el múltiplo debe ser mayor a 0.`);return}
    if(seenC.has(code))errors.push(`Fila ${n}: el código ${code} está repetido.`);
    if(seenN.has(name.toLowerCase()))errors.push(`Fila ${n}: el nombre “${name}” está repetido.`);
    seenC.add(code);seenN.add(name.toLowerCase());
    const old=cur[code]?Number(cur[code].price_per_kg):null,pct=old?((price-old)/old)*100:null;
    if(pct!==null&&Math.abs(pct)>25)warns.push(`${name}: el precio cambia ${pct.toFixed(0)}%. Verificá que sea correcto.`);
    if(cur[code]&&cur[code].name!==name)warns.push(`El código ${code} cambia de nombre: “${cur[code].name}” pasa a “${name}”.`);
    const c0=cur[code],notes=[];if(c0){if(Number(c0.multiple)!==mult)notes.push(`múltiplo ${kg(c0.multiple)} → ${kg(mult)}`);if(c0.active!==yes(r[5]))notes.push(yes(r[5])?'se activa':'se oculta');if(c0.category!==(String(r[2]).trim()||'Otros'))notes.push('cambia la categoría')}
    out.push({code,name,category:String(r[2]).trim(),price,multiple:mult,active:yes(r[5]),old,pct,isNew:!cur[code],notes})});
  S.products.filter(p=>p.active&&!seenC.has(p.code)).forEach(p=>warns.push(`${p.name} no está en el archivo y sigue visible con su precio anterior.`));
  const ch=out.filter(r=>r.isNew||r.old!==r.price||r.notes.length);
  S.prev={rows:out,errors,warns,show:ch,nuevos:out.filter(r=>r.isNew).length,cambian:out.filter(r=>!r.isNew&&(r.old!==r.price||r.notes.length)).length,iguales:out.filter(r=>!r.isNew&&r.old===r.price&&!r.notes.length).length};
  render()}
async function importClients(file){
  const rows=await readSheet(file),bad=[],data=[];
  rows.forEach((r,i)=>{const tax=String(r[1]).replace(/\D/g,''),name=String(r[0]).trim();
    if(!name||!/^\d{7,11}$/.test(tax)){bad.push(`Fila ${i+2}`);return}
    data.push({name,tax_id:tax,email:String(r[2]).trim()||null,phone:String(r[3]).trim()||null,seller:String(r[4]).trim()||null,active:yes(r[5])})});
  if(bad.length)return toast(`Revisá nombre y CUIT/DNI (7 a 11 números) en: ${bad.slice(0,6).join(', ')}.`);
  if(!data.length)return toast('El archivo no tiene clientes.');
  await ok(sb.from('clients').upsert(data,{onConflict:'tax_id'}));
  await loadClients();toast(`${data.length} clientes cargados.`);render()}
async function loadClients(){
  const[c,p]=await Promise.all([sb.from('clients').select('*').order('name'),sb.from('profiles').select('client_id').eq('role','client')]);

    else if(a==='rep'){const o=S.orders.find(x=>x.id==t.dataset.id);S.cart={};let miss=0;itemsOf(o).forEach(i=>{const p=S.products.find(x=>x.code===i.product_code&&x.active);if(p)S.cart[p.code]=i.original_qty;else miss++});S.inv=o.invoice_type;S.view='cat';render();S.sheet='cart';sheetRender();if(miss)toast(`${miss} producto(s) ya no están disponibles y no se agregaron.`)}
    else if(a==='acc'||a==='rej'){await ok(sb.rpc('respond_to_order',{p_order:+t.dataset.id,p_accept:a==='acc'}));await loadOrders();render();toast(a==='acc'?'Pedido confirmado.':'Pedido rechazado.')}

    else if(a==='apr'){const o=S.orders.find(x=>x.id==t.dataset.id),mv=$('#mv-'+o.id);
      const changes=itemsOf(o).filter(i=>qOf(o,i)!==i.qty).map(i=>({item_id:i.id,qty:qOf(o,i)}));

    else if(a==='adv'){await ok(sb.rpc('advance_order',{p_order:+t.dataset.id}));await loadOrders();render()}

  else if(t.id==='fa'){S.inv=t.value;sheetRender()}
  else if(t.id==='pf'&&t.files[0])await previewPrices(t.files[0]);
  else if(t.id==='cf'&&t.files[0]){await importClients(t.files[0]);t.value=''}})});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em')){const b=document.querySelector('[data-a="login"]');if(b)b.click()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
run(boot);
</script>
